<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>ServerOS</title>
    <link rel="stylesheet" href="serveros.css">
</head>
<body>
    <div id="app">
        <div class="nav-tabs">
            <button class="tab active" data-tab="apps">App Store</button>
            <button class="tab" data-tab="installed">Installed Apps</button>
            <button class="tab" data-tab="system">System Resources</button>
            <button class="tab" data-tab="talos">Talos</button>
        </div>

        <div id="tab-apps" class="tab-content active">
            <div class="header">
                <h2>App Store</h2>
                <input type="text" id="search-apps" placeholder="Search apps..." class="search-box">
            </div>
            <div id="app-list" class="app-grid"></div>
        </div>

        <div id="tab-installed" class="tab-content">
            <div class="header"><h2>Installed Apps</h2></div>
            <div id="installed-list" class="app-grid"></div>
        </div>

        <div id="tab-system" class="tab-content">
            <div class="header"><h2>System Resources</h2></div>
            <div id="system-info" class="sys-grid">
                <div class="sys-card" id="cpu-card">
                    <h3>CPU</h3>
                    <div class="metric" id="cpu-usage">--</div>
                    <div class="sub" id="cpu-info">Loading...</div>
                </div>
                <div class="sys-card" id="mem-card">
                    <h3>Memory</h3>
                    <div class="metric" id="mem-usage">--</div>
                    <div class="sub" id="mem-info">Loading...</div>
                </div>
                <div class="sys-card" id="disk-card">
                    <h3>Disk</h3>
                    <div class="metric" id="disk-usage">--</div>
                    <div class="sub" id="disk-info">Loading...</div>
                </div>
                <div class="sys-card" id="uptime-card">
                    <h3>System</h3>
                    <div class="metric" id="uptime-val">--</div>
                    <div class="sub" id="kernel-info">Loading...</div>
                </div>
            </div>
            <div class="header" style="margin-top:2rem"><h3>Processes</h3></div>
            <table id="proc-table" class="proc-table">
                <thead><tr><th>PID</th><th>User</th><th>CPU%</th><th>MEM%</th><th>Command</th></tr></thead>
                <tbody id="proc-body"></tbody>
            </table>
        </div>

        <div id="tab-talos" class="tab-content">
            <div class="header"><h2>Clai TALOS</h2></div>
            <div id="talos-status" class="sys-card">
                <h3>Status</h3>
                <div id="talos-state" class="metric">Checking...</div>
                <div class="sub">Self-hosted AI assistant &mdash; <a id="talos-dashboard" href="#" style="color:var(--primary);display:none">Open Dashboard :8080</a></div>
            </div>
            <div class="header" style="margin-top:1rem"><h3>Actions</h3></div>
            <div id="talos-actions">
                <button id="talos-install" class="btn btn-primary">Install Clai TALOS</button>
                <button id="talos-start" class="btn btn-primary" disabled>Start</button>
                <button id="talos-stop" class="btn btn-danger" disabled>Stop</button>
                <button id="talos-logs" class="btn">View Logs</button>
            </div>
            <div class="header" style="margin-top:1rem"><h3>Log Output</h3></div>
            <pre id="talos-logs-output" class="log-output">No logs available.</pre>
        </div>

        <div id="toast" class="toast hidden"></div>
    </div>
    <script src="../base1/cockpit.js"></script>
    <script src="serveros.js"></script>
</body>
</html>
