# InterstellarOS mkinitcpio.conf
# Custom initramfs for server workloads: RAID, LUKS, LVM, Btrfs, ZFS

# Early KMS for common server GPUs (optional — remove if headless-only)
MODULES=(btrfs ext4 xfs)

# Boot process hooks
# - base udev: required
# - mdadm:   MD RAID assembly
# - encrypt: LUKS full-disk encryption
# - lvm2:    LVM volumes
# - fsck:    filesystem check at boot
# - resume:  hibernation resume (remove if unused)
HOOKS=(base udev autodetect modconf block mdadm encrypt lvm2 filesystems fsck)

# Compression — zstd is fastest decompression at boot
COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-19)
