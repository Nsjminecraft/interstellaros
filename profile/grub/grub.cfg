# InterstellarOS GRUB bootloader config
# Dual UEFI + BIOS boot support

set default=0
set timeout=3
set fallback=1

# Graphics
set gfxmode=auto
set gfxpayload=keep

menuentry "InterstellarOS (linux-cachyos)" {
    search --no-floppy --fs-uuid --set=root LABEL=INTERSTELLAROS
    linux /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-cachyos archisobasedir=%INSTALL_DIR% archisolabel=INTERSTELLAROS quiet
    initrd /%INSTALL_DIR%/boot/x86_64/initramfs-linux-cachyos.img
}

menuentry "InterstellarOS (fallback initramfs)" {
    search --no-floppy --fs-uuid --set=root LABEL=INTERSTELLAROS
    linux /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-cachyos archisobasedir=%INSTALL_DIR% archisolabel=INTERSTELLAROS
    initrd /%INSTALL_DIR%/boot/x86_64/initramfs-linux-cachyos-fallback.img
}

menuentry "InterstellarOS (serial console)" {
    search --no-floppy --fs-uuid --set=root LABEL=INTERSTELLAROS
    linux /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-cachyos archisobasedir=%INSTALL_DIR% archisolabel=INTERSTELLAROS console=ttyS0,115200
    initrd /%INSTALL_DIR%/boot/x86_64/initramfs-linux-cachyos.img
}
