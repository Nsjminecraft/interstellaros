# InterstellarOS nftables firewall
# Default deny inbound, allow outbound; open only needed services

table inet filter {
    chain input {
        type filter hook input priority 0; policy drop;

        # Allow established/related connections
        ct state established,related accept

        # Allow loopback
        iifname "lo" accept

        # ICMP (ping)
        ip protocol icmp accept
        ip6 nexthdr icmpv6 accept

        # SSH (rate-limited)
        tcp dport 22 ct state new limit rate { 10/minute } accept

        # HTTP / HTTPS
        tcp dport { 80, 443 } accept

        # Kubernetes API (if running control-plane)
        tcp dport 6443 accept

        # Samba (uncomment to enable)
        # tcp dport { 139, 445 } accept
        # udp dport { 137, 138 } accept

        # NFS (uncomment to enable)
        # tcp dport 2049 accept

        # Prometheus node_exporter (restrict to monitoring net)
        # tcp dport 9100 ip saddr 10.0.0.0/8 accept
    }

    chain forward {
        type filter hook forward priority 0; policy drop;

        ct state established,related accept

        # Allow forwarding from Docker/container bridges (uncomment when needed)
        # iifname "docker0" accept
        # iifname "br-*" accept
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}
