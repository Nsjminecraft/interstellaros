# ServerOS GRUB bootloader config
# Dual UEFI + BIOS boot support

set default=0
set timeout=3
set fallback=1

# Graphics
set gfxmode=auto
set gfxpayload=keep

menuentry "ServerOS (linux-cachyos)" {
    search --no-floppy --fs-uuid --set=root LABEL=SERVEROS
    linux /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-cachyos archisobasedir=%INSTALL_DIR% archisolabel=SERVEROS quiet
    initrd /%INSTALL_DIR%/boot/x86_64/initramfs-linux-cachyos.img
}

menuentry "ServerOS (fallback initramfs)" {
    search --no-floppy --fs-uuid --set=root LABEL=SERVEROS
    linux /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-cachyos archisobasedir=%INSTALL_DIR% archisolabel=SERVEROS
    initrd /%INSTALL_DIR%/boot/x86_64/initramfs-linux-cachyos-fallback.img
}

menuentry "ServerOS (serial console)" {
    search --no-floppy --fs-uuid --set=root LABEL=SERVEROS
    linux /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-cachyos archisobasedir=%INSTALL_DIR% archisolabel=SERVEROS console=ttyS0,115200
    initrd /%INSTALL_DIR%/boot/x86_64/initramfs-linux-cachyos.img
}
